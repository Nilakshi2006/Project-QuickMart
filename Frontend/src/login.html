<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QuickMart-Login</title>
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/891/891462.png" type="image/png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <link rel="stylesheet" href="../styles/login.css"/>
</head>

<body>
  <!-- Navbar -->
  <nav>
    <div class="logo"><a href="home.html">QuickMart</a></div>
    <ul id="navLink">
      <li><a href="index.html">Home</a></li>
      <li><a href="products.html">Products</a></li>
      <li><a href="whyus.html">Why Us</a></li>
      <li><a href="login.html">Login</a></li>
      <li><a href="signup.html">Signup</a></li>
         <li><a href="logout.html">Logout</a></li>
    </ul>
  </nav>

  <!-- Decorative Background -->
  <div class="background-deco"></div>

  <!-- Login Container -->
  <section class="login-section">
    <div class="login-container">
      <h1>Welcome Back!</h1>
      <p class="subtitle">Log in to continue shopping the best deals</p>

      <form id="form">
        <input type="email" id="email" placeholder="Email" required />
        
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="Password" required />
          <span id="togglePassword" class="toggle-password">👁</span>
        </div>

        <div class="options">
          <label>
            <input type="checkbox" id="remember"> Remember Me
          </label>
          <a href="#" class="forgot-link">Forgot Password?</a>
        </div>

        <button id="btn" type="submit">Login</button>

        <div class="divider"><span>OR</span></div>

        <div class="social-login">
          <button type="button" class="google-login">🔗 Login with Google</button>
          <button type="button" class="facebook-login">🔗 Login with Facebook</button>
        </div>

        <p class="signup-prompt">
          Don’t have an account?
          <a href="#" onclick="signup()">Sign Up</a>
        </p>
      </form>
    </div>
  </section>

  <footer>
    <p>© 2025 MyShop. All rights reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="../scripts/login.js"></script>
  <script>
    // Show/hide password
    const togglePassword = document.querySelector('#togglePassword');
    const passwordField = document.querySelector('#password');
    togglePassword.addEventListener('click', () => {
      const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordField.setAttribute('type', type);
      togglePassword.textContent = type === 'password' ? '👁' : '🙈';
    });
  </script>
</body>
</html>
