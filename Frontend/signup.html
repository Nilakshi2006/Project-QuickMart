<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QuickMart-Signup</title>
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/891/891462.png" type="image/png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

    <link rel="stylesheet" href="styles/signup.css">
</head>

<body>
  <!-- Navbar -->
 <nav>
    <div class="logo"><a href="home.html">QuickMart</a></div>
    <ul id="navLink">
      <li><a href="index.html">Home</a></li>
      <li><a href="products.html">Products</a></li>
      <li><a href="whyus.html">Why Us</a></li>
      <li><a href="login.html">Login</a></li>
      <li><a href="signup.html">Signup</a></li>
         <li><a href="logout.html">Logout</a></li>
    </ul>
  </nav>

  <!-- Signup Section -->
  <section class="signup-section">
    <div class="signup-container">
      <h1>Create Your Account</h1>
      <p class="subtitle">Join us today and enjoy exclusive shopping benefits!</p>

  

      <form id="form">
        <input type="text" id="name" placeholder="Full Name" required />
        <input type="email" id="email" placeholder="Email Address" required />
        <input type="password" id="password" placeholder="Password" required />
        <input type="text" id="phoneNumber" placeholder="Phone Number" />
        <input type="number" id="age" placeholder="Age" min="1" />

        <!-- Terms and Privacy -->
        <div class="terms">
          <input type="checkbox" id="terms" required />
          <label for="terms">
            I agree to the <a href="#">Terms of Service</a> and 
            <a href="#">Privacy Policy</a>.
          </label>
        </div>

        <button id="btn" type="submit">Sign Up</button>
      </form>

      <!-- Social Signup -->
      <div class="social-signup">
        <p>Or sign up with</p>
        <div class="social-buttons">
          <button class="google-btn">
            <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" alt="Google" />
            Google
          </button>
          <button class="facebook-btn">
            <img src="https://cdn-icons-png.flaticon.com/512/124/124010.png" alt="Facebook" />
            Facebook
          </button>
        </div>
      </div>

      <p class="login-prompt">
        Already have an account? <a href="#" onclick="login()">Login here</a>
      </p>
    </div>
  </section>

  <footer>
    <p>© 2025 MyShop. All rights reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="scripts/signup.js"></script>
</body>
</html>
