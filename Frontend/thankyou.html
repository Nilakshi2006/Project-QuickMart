<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thank You - QuickMart</title>
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/891/891462.png" type="image/png" />
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f8f9fa;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    h1 {
      color: #28a745;
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 1.25rem;
      margin-bottom: 2rem;
    }
    .home-btn {
      display: inline-block;
      padding: 12px 24px;
      background-color: teal;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }
    .home-btn:hover {
      background-color: teal;
    }
    .checkmark {
      color: #28a745;
      font-size: 5rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="checkmark">✓</div>
  <h1>Thank You!</h1>
  <p>Your order has been placed successfully.</p>
  <p>We appreciate your purchase at QuickMart.</p>
  <a href="index.html" class="home-btn">Return to Home</a>
</body>
</html>
