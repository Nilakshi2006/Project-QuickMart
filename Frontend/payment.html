<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickMart - Payment</title>
  <link rel="stylesheet" href="styles/navbar.css">
  <link rel="stylesheet" href="styles/payment.css" />
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/891/891462.png" type="image/png">
</head>
<body>
  <nav>
    <div class="logo"><a href="index.html">QuickMart</a></div>
    <button class="nav-toggle" aria-label="Toggle navigation">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <ul id="navLink">
      <li><a href="index.html">Home</a></li>
      <li><a href="products.html">Products</a></li>
      <li><a href="whyus.html">Why Us</a></li>
      <li><a href="login.html">Login</a></li>
      <li><a href="signup.html">Signup</a></li>
      <li><a href="logout.html">Logout</a></li>
      <li><a href="products.html" class="cart-link">🛒 Cart<span id="cart-count" class="cart-badge">0</span></a></li>
    </ul>
  </nav>

  <div class="payment-container">
    <h1>Checkout & Payment</h1>

    <div class="main-content">
      <!-- User Info Section -->
      <div class="user-info">
        <h2>Shipping Information</h2>
        <form id="user-form">
          <input type="text" id="name" placeholder="Full Name" required />
          <input type="email" id="email" placeholder="Email Address" required />
          <input type="text" id="address" placeholder="Delivery Address" required />
          <input type="text" id="city" placeholder="City" required />
          <input type="text" id="pincode" placeholder="Pincode" required />
          <input type="text" id="phone" placeholder="Phone Number" required />
        </form>
      </div>

      <!-- Cart Products Section -->
      <div class="cart-summary">
        <h2>Your Cart</h2>
        <div id="cart-items"></div>
        <p class="total">Total: ₹<span id="total-price">0</span></p>
      </div>
    </div>

    <!-- Payment Options -->
    <div class="payment-methods">
  <h2>Payment Options</h2>

 <div class="methods">

  <label>
    <input type="radio" name="payment" value="upi" checked />
    <img src="https://upload.wikimedia.org/wikipedia/commons/e/e1/UPI-Logo-vector.svg" alt="UPI" />
    UPI (Google Pay / PhonePe / Paytm)
  </label>

  <label>
    <input type="radio" name="payment" value="card" />
    <img src="https://cdn-icons-png.flaticon.com/512/633/633611.png" alt="Card" />
    Credit / Debit Card
  </label>

  <label>
    <input type="radio" name="payment" value="netbanking" />
    <img src="https://cdn-icons-png.flaticon.com/512/2830/2830284.png" alt="Net Banking" />
    Net Banking
  </label>

  <label>
    <input type="radio" name="payment" value="cod" />
    <img src="https://cdn-icons-png.flaticon.com/512/891/891462.png" alt="Cash on Delivery" />
    Cash on Delivery
  </label>

</div>
    <button id="place-order">Place Order</button>
  </div>

  <script src="scripts/navbar.js"></script>
  <script src="scripts/payment.js"></script>
</body>
</html>
